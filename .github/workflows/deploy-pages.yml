name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build Vite site
        env:
          # 在仓库 Settings → Secrets and variables → Actions → Variables 中配置后端地址
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: |
          # 项目站点路径为 /仓库名/，HashRouter 不依赖服务端回退
          BASE="/${GITHUB_REPOSITORY#*/}/"
          echo "base=$BASE api=$VITE_API_BASE"
          npx tsc -b
          npx vite build --base="$BASE"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
